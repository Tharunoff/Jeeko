name: Keep academia scraper awake

# Render's free tier spins the service down after ~15 minutes of no
# incoming requests, which makes the first request after that take
# 30-60s (cold start). Pinging /health every 10 minutes keeps it warm
# so Jeeko's academia tool responds quickly.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 60 https://jeeko.onrender.com/health
